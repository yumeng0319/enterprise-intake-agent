<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="620" fill="#ffffff"/>

  <!-- Raw Request -->
  <rect x="330" y="14" width="200" height="42" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="430" y="40" text-anchor="middle" font-size="15" fill="#1f2937">Raw Request (text)</text>

  <line x1="430" y1="56" x2="430" y2="88" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1 Extract -->
  <rect x="290" y="90" width="280" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="430" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">1. Extract Facts</text>
  <text x="430" y="134" text-anchor="middle" font-size="12.5" fill="#4f46e5">LLM — language understanding</text>

  <line x1="430" y1="148" x2="430" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Structured Facts label -->
  <text x="430" y="196" text-anchor="middle" font-size="12.5" fill="#6b7280" font-style="italic">structured facts</text>

  <!-- branch lines -->
  <line x1="430" y1="204" x2="430" y2="222" stroke="#4b5563" stroke-width="2"/>
  <line x1="220" y1="222" x2="640" y2="222" stroke="#4b5563" stroke-width="2"/>
  <line x1="220" y1="222" x2="220" y2="248" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="222" x2="640" y2="248" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 Classify -->
  <rect x="80" y="250" width="280" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="220" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">2. Classify</text>
  <text x="220" y="294" text-anchor="middle" font-size="12.5" fill="#4f46e5">LLM — domain + work type</text>

  <!-- 3 Priority -->
  <rect x="500" y="250" width="280" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">3. Priority</text>
  <text x="640" y="294" text-anchor="middle" font-size="12.5" fill="#b45309">Rule engine — 0 LLM calls</text>

  <!-- merge lines -->
  <line x1="220" y1="308" x2="220" y2="330" stroke="#4b5563" stroke-width="2"/>
  <line x1="640" y1="308" x2="640" y2="330" stroke="#4b5563" stroke-width="2"/>
  <line x1="220" y1="330" x2="640" y2="330" stroke="#4b5563" stroke-width="2"/>
  <line x1="430" y1="330" x2="430" y2="352" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Route -->
  <rect x="290" y="354" width="280" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="430" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">4. Route</text>
  <text x="430" y="398" text-anchor="middle" font-size="12.5" fill="#4f46e5">LLM + hard policy overrides</text>

  <line x1="430" y1="412" x2="430" y2="444" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 Respond -->
  <rect x="290" y="446" width="280" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="430" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">5. Respond</text>
  <text x="430" y="490" text-anchor="middle" font-size="12.5" fill="#4f46e5">LLM — draft first response</text>

  <line x1="430" y1="504" x2="430" y2="536" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="240" y="538" width="380" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="566" text-anchor="middle" font-size="14" fill="#166534">Classification · Priority · Routing · Draft Response</text>

  <!-- Legend -->
  <rect x="80" y="596" width="16" height="16" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="102" y="608" font-size="12.5" fill="#374151">Probabilistic (LLM) — language understanding</text>
  <rect x="440" y="596" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="462" y="608" font-size="12.5" fill="#374151">Deterministic (code) — business policy</text>
</svg>
